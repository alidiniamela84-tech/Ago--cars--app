lor:var(--ok)}.btnrow .btn{flex:1;min-width:140px}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr)}.tab{border:0;background:transparent;padding:8px 4px;color:#667085;font-size:12px;font-weight:700}.tab.active{color:#0b1220}.tab span{display:block;font-size:20px;margin-bottom:2px}.screen{display:none}.screen.active{display:block}.invoice-item{border:1px solid var(--line);border-radius:16px;padding:13px;margin:10px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}.invoice-item strong{display:block}.right{text-align:right}.empty{padding:28px;text-align:center;color:var(--muted)}.search{margin-bottom:10px}.preview{background:white;border-radius:18px;padding:22px;box-shadow:0 8px 30px #00000012}.preview-head{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:18px;align-items:start;padding-bottom:14px;border-bottom:2px solid #111827}.sellerInfo{font-size:13px;line-height:1.45}.sellerInfo .companyLine{white-space:nowrap}.invoiceMeta{text-align:right;min-width:190px;font-size:14px;line-height:1.45}.invoiceMeta strong{font-size:18px;letter-spacing:.3px}.invoiceMeta .metaLine{white-space:nowrap}.preview h2{margin:0}.preview table{width:100%;border-collapse:collapse;margin-top:18px}.preview th,.preview td{border:1px solid #d0d5dd;padding:8px;text-align:left;font-size:13px}.preview th{background:#f2f4f7}.total{text-align:right;font-size:18px;font-weight:800;margin-top:16px}.small{font-size:11px;color:#667085}.logoBox{width:92px;height:72px;border-radius:14px;background:#000;display:grid;place-items:center;overflow:hidden;box-shadow:0 3px 12px #0003}.logoBox img{width:100%;height:100%;object-fit:contain}.invoiceLogo{width:150px;max-height:90px;object-fit:contain;background:#000;border-radius:8px}.section-spacer{height:6px}@media(max-width:560px) /* Wider invoice table for mobile/PDF */
.preview{overflow:visible}
.preview table{width:calc(100% + 20px);margin-left:-10px;table-layout:fixed}
.preview table th:nth-child(1),.preview table td:nth-child(1){width:25%}

.preview table th:nth-child(3),.preview table td:nth-child(3){width:25%;white-space:normal}

/* Invoice layout improvements */
.preview{max-width:100%;overflow:visible}
.invoiceLogo,.logoBox{background:#fff !important}
.buyerTable{width:100%;table-layout:fixed;margin-top:18px;border-collapse:collapse}

.signatureBox{min-height:100px;margin-top:28px;font-size:14px}

function renderList(){let arr=getInvoices(), q=($('search').value||'').toLowerCase(); let box=$('invoiceList'); let filtered=arr.map((x,i)=>({x,i})).filter(({x})=>[x.num,x.buyer,x.vin,x.brand,x.model].join(' ').toLowerCase().includes(q)); if(!filtered.length){box.innerHTML='<div class="empty">Aucune facture trouvée.</div>';return} box.innerHTML=filtered.map(({x,i})=>`<div class="invoice-item"><div><strong>${esc(x.num)}</strong><div>${esc(x.buyer)}</div><div class="muted">${esc(x.brand)} ${esc(x.model)} · ${esc(x.vin)}</div></div><div class="right"><strong>${euro(x.total)}</strong><div class="btnrow" style="margin-top:7px"><button class="btn secondary" onclick="editInvoice(${i})">Ouvrir</button><button class="btn danger" onclick="deleteInvoice(${i})">Suppr.</button></div></div></div>`).join('')}
function editInvoice(i){let arr=getInvoices(); fill(arr[i]); localStorage.setItem('agoEditIndex',String(i)); showScreen('new')}
function deleteInvoice(i){if(!confirm('Supprimer cette facture ?')) return; let arr=getInvoices(); arr.splice(i,1); setInvoices(arr); renderList(); updateHome()}
function updateHome(){let arr=getInvoices(); $('countInvoices').textContent=arr.length; $('lastInvoice').textContent=arr[0]?.num||'—'}
function printInvoice(){makePreview(); setTimeout(()=>window.print(),250)}
async function shareInvoice(){let o=collect(); let text=`FACTURE ${o.num}\nAGO CARS\nAcheteur: ${o.buyer}\nVéhicule: ${o.brand} ${o.model}\nVIN: ${o.vin}\nTotal TTC: ${euro(o.total)}`; if(navigator.share){try{await navigator.share({title:'Facture '+o.num,text})}catch(e){}} else {await navigator.clipboard.writeText(text); alert('Informations copiées.')}}
newInvoice(); updateHome();
</script>
