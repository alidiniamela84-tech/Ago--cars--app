function getInvoices(){return cloudInvoices.length?cloudInvoices:JSON.parse(localStorage.getItem('agoInvoicesCache')||localStorage.getItem('agoInvoices')||'[]')}
function setInvoices(v){cloudInvoices=v;localStorage.setItem('agoInvoicesCache',JSON.stringify(v))}
async function api(path,opts={}){
  const headers={apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json',...(opts.headers||{})};
  const r=await fetch(SUPA_URL+path,{...opts,headers});
  const text=await r.text();
  if(!r.ok) throw new Error(text||('HTTP '+r.status));
  return text?JSON.parse(text):null;
}
async function loadCloudInvoices(migrate=false){
  try{
    let rows=await api('/rest/v1/invoices?select=id,invoice_number,data,created_at&order=created_at.desc');
    cloudInvoices=(rows||[]).map(r=>({...r.data,_cloudId:r.id}));
    if(migrate && cloudInvoices.length===0){
      const old=JSON.parse(localStorage.getItem('agoInvoices')||localStorage.getItem('agoInvoicesCache')||'[]');
      for(const o of old){if(!o._cloudId) await insertCloudInvoice(o)}
      rows=await api('/rest/v1/invoices?select=id,invoice_number,data,created_at&order=created_at.desc');
      cloudInvoices=(rows||[]).map(r=>({...r.data,_cloudId:r.id}));
    }
    setInvoices(cloudInvoices); updateHome(); renderList();
    return true;
  }catch(e){
    console.error('Supabase sync error',e);
    const cache=JSON.parse(localStorage.getItem('agoInvoicesCache')||localStorage.getItem('agoInvoices')||'[]');
    cloudInvoices=cache; updateHome(); renderList();
    return false;
  }
}
async function insertCloudInvoice(o){
  const clean={...o};delete clean._cloudId;
  const rows=await api('/rest/v1/invoices?select=id',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({invoice_number:o.num,data:clean})});
  return rows?.[0]?.id;
}
async function updateCloudInvoice(id,o){
  const clean={...o};delete clean._cloudId;
  await api('/rest/v1/invoices?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({invoice_number:o.num,data:clean,updated_at:new Date().toISOString()})});
}
async function deleteCloudInvoice(id){
  await api('/rest/v1/invoices?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:{Prefer:'return=minimal'}});
}
function nextNum(){let y=new Date().getFullYear();let inv=getInvoices();let max=0;inv.forEach(x=>{let m=(x.num||'').match(/(\d+)$/);if(m)max=Math.max(max,+m[1])});return y+'-'+String(max+1).padStart(3,'0')}

function fill(o){ids.forEach(id=>{$(id).value=o[id]??''})}
async function saveInvoice(){
  let o=collect();

  }catch(e){
    console.error(e);alert('La facture n’a pas pu être synchronisée. Vérifiez la connexion ou les autorisations Supabase.');
  }
}

function renderList(){let arr=getInvoices(), q=($('search').value||'').toLowerCase(); let box=$('invoiceList'); let filtered=arr.map((x,i)=>({x,i})).filter(({x})=>[x.num,x.buyer,x.vin,x.brand,x.model].join(' ').toLowerCase().includes(q)); if(!filtered.length){box.innerHTML='<div class="empty">Aucune facture trouvée.</div>';return} box.innerHTML=filtered.map(({x,i})=>`<div class="invoice-item"><div><strong>${esc(x.num)}</strong><div>${esc(x.buyer)}</div><div class="muted">${esc(x.brand)} ${esc(x.model)} · ${esc(x.vin)}</div></div><div class="right"><strong>${euro(x.total)}</strong><div class="btnrow" style="margin-top:7px"><button class="btn secondary" onclick="editInvoice(${i})">Ouvrir</button><button class="btn danger" onclick="deleteInvoice(${i})">Suppr.</button></div></div></div>`).join('')}
function editInvoice(i){let arr=getInvoices(); fill(arr[i]); localStorage.setItem('agoEditIndex',String(i)); showScreen('new')}
async function deleteInvoice(i){if(!confirm('Supprimer cette facture ?'))return;try{let o=getInvoices()[i];if(o?._cloudId)await deleteCloudInvoice(o._cloudId);await loadCloudInvoices(false)}catch(e){console.error(e);alert('Suppression impossible. Vérifiez la connexion ou les autorisations Supabase.')}}
function updateHome(){let arr=getInvoices(); $('countInvoices').textContent=arr.length; $('lastInvoice').textContent=arr[0]?.num||'—'}
function printInvoice(){makePreview(); setTimeout(()=>window.print(),250)}
async function shareInvoice(){let o=collect(); let text=`FACTURE ${o.num}\nAGO CARS\nAcheteur: ${o.buyer}\nVéhicule: ${o.brand} ${o.model}\nVIN: ${o.vin}\nTotal TTC: ${euro(o.total)}`; if(navigator.share){try{await navigator.share({title:'Facture '+o.num,text})}catch(e){}} else {await navigator.clipboard.writeText(text); alert('Informations copiées.')}}
newInvoice(); updateHome(); (async()=>{await loadCloudInvoices(true); newInvoice();})();
