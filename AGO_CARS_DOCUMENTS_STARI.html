const app=document.getElementById('app'),dlg=document.getElementById('dlg');let section=null;const DB='ago_docs_v1';
function get(){try{return JSON.parse(localStorage.getItem(DB)||'[]')}catch{return[]}}function set(x){localStorage.setItem(DB,JSON.stringify(x))}
function home(){section=null;app.innerHTML=`<h2>Mes documents</h2><div class="home"><button class="card" onclick="openSec('company')"><span class="ico">🏢</span>Documents société</button><button class="card" onclick="openSec('vehicle')"><span class="ico">🚗</span>Documents véhicules</button></div><p class="note">Version simple : les documents restent enregistrés sur ce téléphone. Pour les documents importants, gardez aussi une copie originale dans Fichiers/iCloud.</p>`}
function openSec(s){section=s;render()}function render(){let title=section==='company'?'Documents société':'Documents véhicules',docs=get().filter(x=>x.section===section);app.innerHTML=`<button class="back" onclick="home()">‹ Retour</button><h2>${title}</h2><button class="add" onclick="showAdd()">＋ Ajouter un document</button><div id="list"></div>`;let l=document.getElementById('list');if(!docs.length)l.innerHTML='<div class="empty">Aucun document pour le moment.</div>';else docs.sort((a,b)=>b.date-a.date).forEach(d=>{let el=document.createElement('div');el.className='doc';el.innerHTML=`<span style="font-size:26px">${d.type.includes('pdf')?'📄':'🖼️'}</span><div class="meta"><b>${esc(d.name)}</b><small>${esc(d.ref||'')}${d.ref?' · ':''}${new Date(d.date).toLocaleDateString('fr-FR')}</small></div><a href="${d.data}" target="_blank">Ouvrir</a><button class="del" onclick="delDoc('${d.id}')">🗑️</button>`;l.appendChild(el)})}
function showAdd(){form.reset();dlg.showModal()}function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
form.onsubmit=e=>{e.preventDefault();let f=file.files[0];if(!f)return; if(f.size>25*1024*1024){alert('Fichier trop grand. Choisissez un fichier de moins de 4 Mo.');return}let r=new FileReader();r.onload=()=>{let a=get();a.push({id:Date.now().toString(),section,name:name.value.trim(),ref:ref.value.trim(),type:f.type||'',data:r.result,date:Date.now()});try{set(a);dlg.close();render()}catch(e){alert('Mémoire du téléphone pleine. Utilisez un fichier plus petit.')}};r.readAsDataURL(f)};
function delDoc(id){if(confirm('Supprimer ce document ?')){set(get().filter(x=>x.id!==id));render()}}home();
</script></body></html>
